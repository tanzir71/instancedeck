name: Pages
on:
  push:
    branches: [main]
    paths:
      [
        'apps/site/**',
        'packages/**',
        'scripts/**',
        'design/**',
        '.github/workflows/pages.yml',
        'pnpm-lock.yaml',
      ]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
env:
  ASTRO_TELEMETRY_DISABLED: '1'
  STORYBOOK_DISABLE_TELEMETRY: '1'
  SITE_URL: https://tanzir71.github.io
  BASE_PATH: /instancedeck
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm tokens
      - run: pnpm --filter @instancedeck/site typecheck
      - run: pnpm --filter @instancedeck/site build
      - run:
          pnpm exec playwright test tests/site.spec.ts tests/marketing.spec.ts
      - run: pnpm --filter @instancedeck/site test:lighthouse
      - run: pnpm build:storybook
      - run: node scripts/package-pages.mjs
      - run: node scripts/verify-packaged-storybook.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/site/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: site-verification
          path: |
            artifacts/p6/*.json
            artifacts/p6/*.png
            artifacts/p6/lighthouse/
            playwright-report/
            test-results/
  deploy:
    # Enable only once the public feature claims match shipped desktop behavior.
    if: vars.SITE_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  notify-search:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/indexnow.mjs
