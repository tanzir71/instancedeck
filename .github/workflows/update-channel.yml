name: Update beta feed
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published finalized prerelease tag
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: updater-beta
  cancel-in-progress: false
jobs:
  beta:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node scripts/promote-beta-feed.mjs
