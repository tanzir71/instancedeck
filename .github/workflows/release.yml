name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag
        required: true
        type: string
      build_only:
        description: Build and verify packages without changing a GitHub Release
        required: false
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  ASTRO_TELEMETRY_DISABLED: '1'
  STORYBOOK_DISABLE_TELEMETRY: '1'
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: refs/tags/${{ inputs.tag }}
  packages:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-release-version.mjs
      - run: pnpm tokens
      - run:
          pnpm --filter @instancedeck/desktop tauri build --target
          $env:BUILD_TARGET --bundles nsis --ci
      - run:
          cargo build --release --locked -p ideck-cli --target $env:BUILD_TARGET
      - run:
          ./scripts/package-release.ps1 -Target $env:BUILD_TARGET -Architecture
          $env:BUILD_ARCH -Version ($env:RELEASE_TAG.Substring(1))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/release-${{ matrix.arch }}/
          if-no-files-found: error
  draft:
    if: github.event_name == 'push' || inputs.build_only == false
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/release-artifacts
      - run: node scripts/create-draft-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
