[package]
name = "ideck-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
bindings = ["dep:specta"]

[dependencies]
fs2 = "=0.4.3"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
specta = { version = "=2.0.0-rc.28", optional = true, features = ["derive"] }
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting"] }
tracing = "=0.1.44"
ulid = "=3.0.0"

[dev-dependencies]
sha2 = "=0.10.9"
tempfile = "3.27.0"
