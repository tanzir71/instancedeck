[package]
name = "ideck-win"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "=0.23.1"
ideck-core = { path = "../ideck-core" }
[target.'cfg(windows)'.dependencies]
notify = { version = "=8.2.2", default-features = false }
sysinfo = { version = "=0.40.3", default-features = false, features = ["system"] }
windows = { version = "=0.62.2", features = ["Management_Deployment", "ApplicationModel", "Storage", "Storage_Search", "Foundation_Collections", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }
winreg = "=0.56.0"

[lints]
workspace = true

[dev-dependencies]
serde_json = "=1.0.154"
tempfile = "=3.27.0"
